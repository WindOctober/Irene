[package]
name = "irene"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "An equivalence checker for hybrid quantum programs"

[lib]
path = "src/lib.rs"

[dependencies]
bigdecimal = "0.4"
bitgauss = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-rational = "0.4"
oq3_lexer = { git = "https://github.com/WindOctober/openqasm3_parser.git", branch = "dev" }
oq3_source_file = { git = "https://github.com/WindOctober/openqasm3_parser.git", branch = "dev" }
oq3_syntax = { git = "https://github.com/WindOctober/openqasm3_parser.git", branch = "dev" }
oxidd = { version = "0.12", default-features = false, features = ["manager-index", "bdd", "apply-cache-direct-mapped"] }
rug = { version = "1.30", default-features = false, features = ["float", "integer", "std"] }
thiserror = "2.0"

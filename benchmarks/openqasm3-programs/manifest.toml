commit = "7fbf9e9eb3692a1288c014d6efd43523701886c6"

[normalization]
encoding = "utf-8"
line_endings = "lf"
semantic_rewrite = true

[[case]]
id = "openqasm3-inverse-qft-control-factorization"
suite = "inverse-qft"
left = "programs/inverse-qft/left.qasm"
right = "programs/inverse-qft/right.qasm"
truth = "eq"
equivalence = "partial"
input_pairs = [
  "quantum:q[0]=quantum:q[0]",
  "quantum:q[1]=quantum:q[1]",
  "quantum:q[2]=quantum:q[2]",
  "quantum:q[3]=quantum:q[3]",
]
output_pairs = [
  "classical:c[0]=classical:c0[0]",
  "classical:c[1]=classical:c1[0]",
  "classical:c[2]=classical:c2[0]",
  "classical:c[3]=classical:c3[0]",
]
qbircks_compatible = false
source_left = "examples/inverseqft1.qasm"
source_right = "examples/inverseqft2.qasm"

